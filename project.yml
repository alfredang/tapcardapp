name: Tapcard
options:
  bundleIdPrefix: com.tertiaryinfotech
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: "GU9WTSTX9M"   # Tertiary Infotech (paid) — same team as Tertiary Scanner / RunTrack GPS
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  Tapcard:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tapcard
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: AuthenticationServices.framework
    info:
      path: Tapcard/Info.plist
      properties:
        CFBundleDisplayName: Tapcard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Allow camera access to scan business cards."
        NSPhotoLibraryUsageDescription: "Allow photo access to import a business card image."
        # Google sign-in: the SDK reads the client ID from here, and the reversed
        # client ID is the URL scheme it uses to receive the callback. Both are
        # public identifiers, not secrets. Keep in sync with GoogleAuthService.
        GIDClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "$(GOOGLE_IOS_URL_SCHEME)"
    entitlements:
      path: Tapcard/Tapcard.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tertiaryinfotech.tapcard
        # Google's iOS OAuth client for com.tertiaryinfotech.tapcard — an
        # iOS-type client from the same Google Cloud project as the web's
        # GOOGLE_CLIENT_ID (the web/Android client can't be reused on iOS).
        # Values come from .env at generate time:
        #   set -a; source .env; set +a; xcodegen generate
        # The URL scheme is the client ID's reversed form. When unset, the app
        # builds fine and simply hides the Google button.
        GOOGLE_IOS_CLIENT_ID: "${GOOGLE_IOS_CLIENT_ID}"
        GOOGLE_IOS_URL_SCHEME: "${GOOGLE_IOS_URL_SCHEME}"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
